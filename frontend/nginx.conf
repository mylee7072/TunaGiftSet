server {
    # nginx-unprivileged's default listen port — lets the whole container run as a
    # non-root user (port 80 would need root to bind).
    listen 8080;
    server_name _;

    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Matches the backend's spring.servlet.multipart.max-*-size default (10MB) so an admin
    # product-image upload isn't rejected by nginx before it ever reaches Spring.
    client_max_body_size 10m;

    # Same-origin API access: the browser only ever talks to this nginx origin, which
    # forwards to the backend over the internal Compose network. This sidesteps CORS
    # entirely in the Docker stack (see compose.yaml) — "backend" is a Docker-internal
    # DNS name, never something the browser resolves itself.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Only relevant when STORAGE_TYPE=local on the backend (see application.properties);
    # harmless no-op when S3 is in use, since uploaded-image URLs then point at S3 directly.
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # React Router (BrowserRouter) fallback: any path not matching a real static file
    # resolves to index.html so client-side routing can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
