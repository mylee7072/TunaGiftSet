<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2f2f2"/>
    </linearGradient>
    <linearGradient id="box1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3546"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="lid1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#374151"/>
      <stop offset="1" stop-color="#2b3546"/>
    </linearGradient>
    <linearGradient id="ribbon1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#caa153"/>
      <stop offset="1" stop-color="#b7791f"/>
    </linearGradient>
    <linearGradient id="can1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8e8ea"/>
      <stop offset="1" stop-color="#c7c9cf"/>
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#bg1)"/>

  <!-- soft ground shadow -->
  <ellipse cx="400" cy="640" rx="230" ry="26" fill="#000000" opacity="0.06"/>

  <!-- gift box -->
  <g>
    <rect x="180" y="360" width="440" height="230" rx="14" fill="url(#box1)"/>
    <rect x="180" y="330" width="440" height="60" rx="10" fill="url(#lid1)"/>
    <!-- ribbon -->
    <rect x="378" y="330" width="44" height="260" fill="url(#ribbon1)"/>
    <rect x="180" y="352" width="440" height="20" fill="url(#ribbon1)"/>
    <!-- bow -->
    <path d="M400 330 C360 300 330 250 372 232 C392 224 400 254 400 274 C400 254 408 224 428 232 C470 250 440 300 400 330 Z" fill="url(#ribbon1)"/>
    <circle cx="400" cy="292" r="12" fill="#e8c377"/>
  </g>

  <!-- row of 12 cans on the lid, evenly arranged -->
  <g>
    <!-- 3 rows x 4 columns of small cylinders representing 12 cans -->
    <!-- row 1 -->
    <g>
      <ellipse cx="222" cy="300" rx="20" ry="9" fill="#9aa0ab"/>
      <rect x="202" y="262" width="40" height="38" fill="url(#can1)"/>
      <ellipse cx="222" cy="262" rx="20" ry="9" fill="#f2f3f5"/>
      <ellipse cx="222" cy="262" rx="13" ry="6" fill="#5b6472"/>
    </g>
    <g>
      <ellipse cx="278" cy="300" rx="20" ry="9" fill="#9aa0ab"/>
      <rect x="258" y="262" width="40" height="38" fill="url(#can1)"/>
      <ellipse cx="278" cy="262" rx="20" ry="9" fill="#f2f3f5"/>
      <ellipse cx="278" cy="262" rx="13" ry="6" fill="#5b6472"/>
    </g>
    <g>
      <ellipse cx="334" cy="300" rx="20" ry="9" fill="#9aa0ab"/>
      <rect x="314" y="262" width="40" height="38" fill="url(#can1)"/>
      <ellipse cx="334" cy="262" rx="20" ry="9" fill="#f2f3f5"/>
      <ellipse cx="334" cy="262" rx="13" ry="6" fill="#5b6472"/>
    </g>
    <!-- gap for ribbon -->
    <g>
      <ellipse cx="466" cy="300" rx="20" ry="9" fill="#9aa0ab"/>
      <rect x="446" y="262" width="40" height="38" fill="url(#can1)"/>
      <ellipse cx="466" cy="262" rx="20" ry="9" fill="#f2f3f5"/>
      <ellipse cx="466" cy="262" rx="13" ry="6" fill="#5b6472"/>
    </g>
    <g>
      <ellipse cx="522" cy="300" rx="20" ry="9" fill="#9aa0ab"/>
      <rect x="502" y="262" width="40" height="38" fill="url(#can1)"/>
      <ellipse cx="522" cy="262" rx="20" ry="9" fill="#f2f3f5"/>
      <ellipse cx="522" cy="262" rx="13" ry="6" fill="#5b6472"/>
    </g>
    <g>
      <ellipse cx="578" cy="300" rx="20" ry="9" fill="#9aa0ab"/>
      <rect x="558" y="262" width="40" height="38" fill="url(#can1)"/>
      <ellipse cx="578" cy="262" rx="20" ry="9" fill="#f2f3f5"/>
      <ellipse cx="578" cy="262" rx="13" ry="6" fill="#5b6472"/>
    </g>
  </g>

  <!-- premium tag -->
  <g transform="translate(542,382) rotate(18)">
    <rect x="0" y="0" width="92" height="40" rx="6" fill="#ffffff" stroke="#b7791f" stroke-width="2"/>
    <circle cx="16" cy="20" r="4" fill="#b7791f"/>
    <text x="30" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2937">12호</text>
  </g>

  <text x="400" y="700" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="30" font-weight="700" fill="#18181b">살코기 참치 선물세트 12호</text>
  <text x="400" y="736" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif" font-size="20" fill="#6b7280">PREMIUM TUNA GIFT SET</text>
</svg>
