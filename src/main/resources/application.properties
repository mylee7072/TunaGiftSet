spring.application.name=TunaGiftSet

server.port=${SERVER_PORT:8080}
# Lets in-flight requests (an order being placed, a payment confirm call to Toss) finish
# before the JVM exits instead of being cut off mid-request when the container is stopped.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:30s}

# DB_HOST/DB_PORT/DB_NAME default to the existing local-Postgres values so IntelliJ/local runs
# are unaffected; Docker Compose overrides DB_HOST to the "db" service name (see compose.yaml).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tunagiftset}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# Only "health" is exposed by default in every environment; show-details defaults to hidden
# so a public health check never leaks DB/disk internals (application-dev.properties relaxes
# this for local convenience, application-prod.properties keeps it locked down explicitly).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

app.jwt.secret=${JWT_SECRET:}
app.jwt.expires-in-seconds=${JWT_EXPIRES_IN_SECONDS:3600}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}
app.address.max-addresses-per-member=${ADDRESS_MAX_ADDRESSES_PER_MEMBER:20}

oauth.kakao.client-id=${KAKAO_CLIENT_ID:}
oauth.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
oauth.google.client-id=${GOOGLE_CLIENT_ID:}
oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}

spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:10MB}

storage.type=${STORAGE_TYPE:local}
storage.public-base-url=${STORAGE_PUBLIC_BASE_URL:http://localhost:8080/uploads}
storage.product-image.max-file-size-bytes=${PRODUCT_IMAGE_MAX_FILE_SIZE_BYTES:5242880}
storage.product-image.max-images-per-product=${PRODUCT_IMAGE_MAX_IMAGES_PER_PRODUCT:10}
storage.local.upload-dir=${LOCAL_UPLOAD_DIR:${user.home}/tunagiftset/uploads}
storage.s3.bucket=${S3_BUCKET_NAME:}
storage.s3.region=${AWS_REGION:ap-northeast-2}
storage.s3.endpoint=${S3_ENDPOINT:}
storage.s3.path-style-access=${S3_PATH_STYLE_ACCESS:false}

payment.toss.base-url=${TOSS_BASE_URL:https://api.tosspayments.com}
payment.toss.secret-key=${TOSS_SECRET_KEY:}
payment.toss.connect-timeout-millis=${TOSS_CONNECT_TIMEOUT_MILLIS:3000}
payment.toss.read-timeout-millis=${TOSS_READ_TIMEOUT_MILLIS:5000}
payment.expiration.scheduler.enabled=${PAYMENT_EXPIRATION_SCHEDULER_ENABLED:false}
payment.expiration.scheduler.interval-millis=${PAYMENT_EXPIRATION_SCHEDULER_INTERVAL_MILLIS:60000}
