# Activated with SPRING_PROFILES_ACTIVE=prod. Deliberately conservative: values with no
# fallback here are required — if they're missing the app fails fast at startup instead of
# silently running with a dev-safe default in a production environment.

# Schema changes belong to a migration tool, not to Hibernate auto-DDL, once real data exists.
# "validate" only checks the entities match the existing schema; it never alters anything.
# See the completion report for the current migration-adoption recommendation.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=false

# No permissive localhost fallback in prod — the allowed origin(s) must be set explicitly.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# No empty-string fallback in prod — JwtTokenProvider already rejects a blank secret at request
# time, but failing at startup instead of on the first login attempt is a clearer signal.
app.jwt.secret=${JWT_SECRET}

# Same story as CORS/JWT: a real deployment must set this explicitly rather than inherit a
# same-host default.
storage.public-base-url=${STORAGE_PUBLIC_BASE_URL}

management.endpoint.health.show-details=never

logging.level.root=INFO
logging.level.studio.aroundhub.tunagiftset=INFO
