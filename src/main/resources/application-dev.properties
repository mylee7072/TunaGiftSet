# Activated with SPRING_PROFILES_ACTIVE=dev (set by compose.yaml for the Docker dev stack;
# a plain local/IntelliJ run with no active profile gets the same effective behavior from
# application.properties alone, so this file only needs to restate it explicitly).

# Convenient for local schema iteration; never used in prod (see application-prod.properties).
spring.jpa.hibernate.ddl-auto=update

# Safe to show DB/disk health detail on a developer's own machine or dev stack.
management.endpoint.health.show-details=always

logging.level.studio.aroundhub.tunagiftset=DEBUG
