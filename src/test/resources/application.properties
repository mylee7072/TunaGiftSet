spring.datasource.url=jdbc:h2:mem:tunagiftset-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=test-jwt-secret-for-tunagiftset-auth-tests-only
app.jwt.expires-in-seconds=3600
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:8080
app.address.max-addresses-per-member=20

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
storage.type=local
storage.public-base-url=http://localhost:8080/uploads
storage.product-image.max-file-size-bytes=5242880
storage.product-image.max-images-per-product=10
storage.local.upload-dir=${java.io.tmpdir}/tunagiftset-test-uploads
storage.s3.bucket=
storage.s3.region=ap-northeast-2
storage.s3.endpoint=
storage.s3.path-style-access=false
